# Kültür Tekno — Dokploy / Docker Compose dağıtımı
# Dokploy'da "Compose" tipi uygulama olarak ekleyin, ortam değişkenlerini
# panelden girin ve "app" servisinin 4000 portuna alan adı yönlendirin.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-citynews}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-citynews}
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-citynews}
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Yönetici}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      MAX_SESSION_HOURS: ${MAX_SESSION_HOURS:-24}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCK_MINUTES: ${LOCK_MINUTES:-15}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      # Dokploy alan adını otomatik bağlar; doğrudan erişim için de açıktır.
      - "4000:4000"

volumes:
  db-data:
  uploads:
