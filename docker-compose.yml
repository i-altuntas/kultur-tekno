# Kültür Tekno — Dokploy / Docker Compose dağıtımı

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: citynews
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:-kulturtekno_db_2026}
    volumes:
      - kulturtekno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-kulturtekno_db_2026}
      PGDATABASE: citynews
      PORT: 4000
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Yönetici}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      MAX_SESSION_HOURS: ${MAX_SESSION_HOURS:-24}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCK_MINUTES: ${LOCK_MINUTES:-15}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - kulturtekno_uploads:/app/uploads

volumes:
  kulturtekno_pgdata:
  kulturtekno_uploads:
